services:
  redis:
    image: redis:7
    container_name: horob1_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "2410", "--databases", "16"]
    volumes:
      - redis_data:/data
    networks:
      - horob1_docub

volumes:
  redis_data:

networks:
  horob1_docub:
    external: true
